[package]
name = "tests"
version = "0.1.0"
edition = "2021"

[dependencies]
ckb-testtool = "0.10.2"
serde_json = "1.0"
rgbpp-core = { path = "../crates/core", features = ["bitcoin-encoder"] }
rand = "0.8"
# Keep in sync with crates/core: the tests in src/spv.rs must exercise what the contracts link.
ckb-bitcoin-spv-verifier = { git = "https://github.com/RGBPlusPlus/ckb-bitcoin-spv.git", rev = "3f7a0ddf947b35c60ce6c63b7fef2005cb12d0af", default-features = false, features = [
  "no-std",
] }

[features]
non-mock-spv-tests = ["dep:bitcoin"]

[dependencies.bitcoin]
version = "0.31"
optional = true

[[test]]
name = "non_mock_spv"
required-features = ["non-mock-spv-tests"]
