name: Checksum

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUILD_IMAGE: docker.io/xxuejie/rust-n-llvm@sha256:71e98a25eb0350c779cdea18c296d101c4ddc375b8fd96531b63f3105ca64ca2

jobs:
  ubuntu-build:
    name: Non-mock release reproducibility and checksums
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_eligible: ${{ steps.release-tag.outputs.eligible }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
        submodules: true
        persist-credentials: false
    - name: Checkout pinned SPV type-script test dependency
      uses: actions/checkout@v4
      with:
        repository: RGBPlusPlus/ckb-bitcoin-spv-contracts
        ref: 0ebc91158c241c514ad670971730515e4e4e39cc
        path: build/spv-contracts-src
        submodules: true
        persist-credentials: false
    - name: Record source and build environment
      run: |
        mkdir -p build-evidence
        git rev-parse HEAD | tee build-evidence/commit.txt
        git submodule status | tee build-evidence/submodules.txt
        echo "$BUILD_IMAGE" | tee build-evidence/image.txt
        docker run --rm -v "$PWD:/code" "$BUILD_IMAGE" bash -euc 'cd /code; rustc -Vv; cargo -V; "$(scripts/find_clang)" --version' | tee build-evidence/toolchain.txt
    - name: Build production contracts twice and verify committed checksums
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD:/code" "$BUILD_IMAGE" bash -euc '
          cd /code
          make build MODE=release CARGO_ARGS=--locked
          sha256sum build/release/btc-time-lock build/release/rgbpp-lock > build-evidence/first.sha256
          cargo clean
          make build MODE=release CARGO_ARGS=--locked
          sha256sum build/release/btc-time-lock build/release/rgbpp-lock > build-evidence/second.sha256
          diff -u build-evidence/first.sha256 build-evidence/second.sha256
          sha256sum -c checksums.txt
          mkdir -p build/non-mock
          cp build/release/btc-time-lock build/release/rgbpp-lock build/non-mock/
        ' 2>&1 | tee build-evidence/build.log
        git diff --exit-code -- Cargo.lock checksums.txt
    - name: Build pinned SPV type-script test dependency
      run: |
        set -euo pipefail
        git -C build/spv-contracts-src rev-parse HEAD | tee build-evidence/spv-contract-source.txt
        git -C build/spv-contracts-src submodule status | tee build-evidence/spv-contract-submodules.txt
        docker run --rm -v "$PWD:/code" "$BUILD_IMAGE" bash -euc '
          cd /code/build/spv-contracts-src
          make build CONTRACT=ckb-bitcoin-spv-type-lock MODE=release CARGO_ARGS=--locked
          cp build/release/ckb-bitcoin-spv-type-lock /code/build/non-mock/
          sha256sum build/release/ckb-bitcoin-spv-type-lock > /code/build-evidence/spv-contract.sha256
        ' 2>&1 | tee build-evidence/spv-contract-build.log
        git -C build/spv-contracts-src diff --exit-code -- Cargo.lock
    - name: Test checksummed production contracts in CKB-VM
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/non-mock-host
      run: |
        set -euo pipefail
        cargo test --locked -p tests --features non-mock-spv-tests --test non_mock_spv -- --nocapture 2>&1 | tee build-evidence/non-mock-vm.log
        git diff --exit-code -- Cargo.lock checksums.txt
    - name: Prepare verified contract release bundle
      run: |
        python3 scripts/prepare-contract-release.py \
          --source-commit "$(git rev-parse HEAD)" --build-image "$BUILD_IMAGE" release-bundle
    - name: Upload verified contract binaries
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: contract-binaries-${{ github.sha }}
        path: release-bundle/
        if-no-files-found: error
    - name: Verify protected version tag points to the default branch history
      id: release-tag
      if: github.repository == 'RGBPlusPlus/rgbpp' && github.event_name == 'push' && github.ref_type == 'tag' && github.ref_protected
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
          exit 0
        fi
        git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
        git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
        echo "eligible=true" >> "$GITHUB_OUTPUT"
    - name: Upload production artifacts and build evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: production-build-${{ github.sha }}
        path: |
          build/release/btc-time-lock
          build/release/rgbpp-lock
          build/non-mock/ckb-bitcoin-spv-type-lock
          checksums.txt
          build-evidence/
        if-no-files-found: error

  publish-release:
    name: Publish verified contract binaries
    needs: ubuntu-build
    if: needs.ubuntu-build.outputs.release_eligible == 'true' && github.repository == 'RGBPlusPlus/rgbpp' && github.event_name == 'push' && github.ref_type == 'tag' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Download verified binaries from this run
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: contract-binaries-${{ github.sha }}
        path: release-bundle
    - name: Verify downloaded bundle matches this run
      working-directory: release-bundle
      run: |
        set -euo pipefail
        jq --exit-status --arg sha "$GITHUB_SHA" '.source_commit == $sha' manifest.json
        sha256sum --strict --check SHA256SUMS
    - name: Publish release for the existing tag
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
        SOURCE_COMMIT: ${{ github.sha }}
      shell: bash
      run: |
        set -euo pipefail
        flags=()
        if [[ "$RELEASE_TAG" == *-* ]]; then
          flags+=(--prerelease)
        fi
        gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
          --notes "Production contracts built and tested by Checksum CI at \`$SOURCE_COMMIT\`. Verify the attached binaries using SHA256SUMS; manifest.json records the source, builder, and CKB data hashes." \
          "${flags[@]}" release-bundle/btc-time-lock release-bundle/rgbpp-lock \
          release-bundle/SHA256SUMS release-bundle/manifest.json
