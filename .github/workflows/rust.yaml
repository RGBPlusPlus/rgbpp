name: Rust

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu-build:

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - name: Install clang 18 from Ubuntu packages
      run: sudo apt-get update && sudo apt-get install -y clang-18
    - name: Install riscv64 target
      run: rustup target add riscv64imac-unknown-none-elf
    - name: Build mock-light-client test binaries
      run: make build CLANG=clang-18 CUSTOM_RUSTFLAGS="-C debug-assertions=yes" CARGO_ARGS="--locked --features=rgbpp-core/mock-bitcoin-light-client"
    - name: Run host tests, mock contract tests, and static checks
      run: make test check clippy CARGO_ARGS=--locked


  core-tests:
    name: Core (${{ matrix.features }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [default, bitcoin-encoder]
        profile: [test, release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Core formatting
        run: cargo +1.100.0 fmt -p rgbpp-core -- --check
      - name: Unit and API integration tests (default features)
        if: matrix.features == 'default'
        run: cargo +1.100.0 test --locked --profile ${{ matrix.profile }} -p rgbpp-core
      - name: Unit and API integration tests (Bitcoin encoder)
        if: matrix.features == 'bitcoin-encoder'
        run: cargo +1.100.0 test --locked --profile ${{ matrix.profile }} -p rgbpp-core --features bitcoin-encoder,molecule/std
