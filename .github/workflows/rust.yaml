name: Rust

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu-build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - name: Install llvm 16
      run: wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 16 && rm llvm.sh
    - name: Install riscv64 target
      run: rustup target add riscv64imac-unknown-none-elf
    - name: Build mock-light-client test binaries
      run: make build CUSTOM_RUSTFLAGS="-C debug-assertions=yes" CARGO_ARGS="--locked --features=rgbpp-core/mock-bitcoin-light-client"
    - name: Run host tests, mock contract tests, and static checks
      run: make test check clippy CARGO_ARGS=--locked

